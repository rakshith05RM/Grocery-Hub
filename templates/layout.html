<!doctype html>

  <head>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet">
  
    <style>
      body {
        background: url('/static/h.jpg') no-repeat center center fixed; 
        background-size: cover;
        color: #fff;    
        margin: 0;
        height: 100vh; 
       
      }
      .navbar {
        background: rgba(11, 11, 11, 0.5); 
      }
      .navbar-dark .navbar-nav .nav-link {
        color: #0f0101; 
      }
      .container {
        background: rgba(85, 84, 84, 0.5); 
        padding: 20px;
        border-radius: 8px;
      }
 
      a {
      font-weight:bold; 
     }
     a:hover {
        color: rgb(11, 2, 11) !important;
      }

        .animated-text {
            animation: fadeIn 2s ease-in-out;
            max-width: 80%;
            margin: 20px auto;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
  
    </style>
    <title>Grocery Hub-APP</title>
  </head>
  <body>
   <!-- <nav class="navbar navbar-dark text-light">-->

  <nav class="navbar navbar-expand-lg navbar-dark text-light">

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
      </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/home">Home</a>
            </li>
          <li class="nav-item">
          <a class="nav-link text-white" href="/groclist">Grocery list</a>
          </li>
          <li class="nav-item">
          <a class="nav-link text-white" href="/addgroc" tabindex="-1" aria-disabled="true">Add Grocery</a>
          </li>        
          <li class="nav-item">
              <a class="nav-link active text-white" aria-current="page" href="/logout">Logout</a>
          </li>
